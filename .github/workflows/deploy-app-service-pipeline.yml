name: Deploy App Service Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and Test
    uses: ./.github/workflows/build-test-pipeline.yml

  deploy:
    name: Deploy
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7

      - name: Log In to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: ./scripts/deploy-app-service.sh "$AZURE_APP_NAME" "$AZURE_RESOURCE_GROUP"

      - name: Run the Smoke Test
        env:
          ATTEMPTS: 30
        run: ./scripts/health-check.sh "${{ vars.AZURE_APP_URL }}/health" "${{ github.sha }}"
